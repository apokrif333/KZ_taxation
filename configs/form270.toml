# fio2 = "Bekpeisova"
# fio3 = ""

 [[form270.jobs]]
 id = "270_json"
 file_name = "merged_Bekpeisova_Elvira.xlsx"
 civ_servant = false
 tax_year = 2025
 fio1 = "Elvira"
 fio2 = "Bekpeisova"
 fio3 = ""
 iin = "1"
 phone = ""
 email = ""
 ogd_residence = ""
 ogd_location = ""

